# Mosquitto configuration for Codex Quota Bridge
# Listen on all interfaces so LAN devices (T5 board) can connect
listener 1883 0.0.0.0
allow_anonymous true

# ── Logging ──────────────────────────────────────────
log_dest file C:/Users/li/Desktop/Myproject/TuYa/bridge_server/mosquitto.log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true
log_type error
log_type warning
log_type notice
log_type information
